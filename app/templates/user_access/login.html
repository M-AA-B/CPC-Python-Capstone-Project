{% extends "base.html" %}
{% block styles %}<link rel="stylesheet" href="{{ url_for('static', filename='css/user_access.css') }}">{% endblock %}
{% block content %}
<section class="ua-card">
  <h1>Log in</h1>
  {% include "user_access/_flashes.html" %}
  <form method="post" action="{{ url_for('access.login', next=request.args.get('next')) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" required autofocus autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <label class="ua-check"><input type="checkbox" name="remember"> Remember me</label>
    <button type="submit">Log in</button>
  </form>
  <p class="ua-muted">New company? <a href="{{ url_for('access.register') }}">Create a company account</a>.
    Employees get their login from their company admin.</p>
</section>
{% endblock %}
